<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <ul class="todo-list">
        <li>
            <input id="features" type="checkbox">
            <label for="features">Realizar ingeniera de features</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Articulo ing. features</a></li>
            </ul>
        </li>
        <li>
            <input id="coding" type="checkbox">
            <label for="coding">Generar codigo para crear modelo</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Copilot para codigo</a></li>
            </ul>
        </li>
        <li>
            <input id="training" type="checkbox">
            <label for="training">Entrenar modelo de IA</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Video de como entrenar modelo</a></li>
            </ul>
        </li>
        <li>
            <input id="deploy" type="checkbox">
            <label for="deploy">Desplegar modelo de IA</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Mandar correo de despliegue</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
